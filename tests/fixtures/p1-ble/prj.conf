# A bonding peripheral whose bonds and identity persist in settings (NVS), as a deployed
# BLE product's do. Plain build: no bootloader.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_BT_DEVICE_NAME="zmig-ble"
