[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zmig"
version = "0.1.0"
description = "Migration assistant for Zephyr RTOS upgrades: what changed for your project"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "west>=1.2",
]

[project.optional-dependencies]
# Python packages Zephyr's own build scripts import (scripts/requirements-base.txt,
# the subset needed to configure and build). zmig runs `west build` with its own
# interpreter, so these must be importable there.
zephyr = [
    "pyelftools>=0.29",
    "PyYAML>=6.0",
    "pykwalify",
    "packaging",
    "anytree",
    "jsonschema",
    # `west spdx` imports it from v4.x (Zephyr's requirements-base.txt).
    "reuse>=6.0.0",
]

# MCUboot's imgtool (bootloader/mcuboot/scripts/requirements.txt), for sysbuild builds
# that include MCUboot.
mcuboot = [
    "cryptography>=40.0.0",
    "intelhex",
    "click",
    "cbor2",
    "pyyaml",
]

# libclang for the public API/ABI diff (docs/DESIGN-P2.md). The wheel bundles libclang.so;
# ZMIG_LIBCLANG=/path/to/libclang.so selects a system one instead.
api = [
    "libclang==18.1.1",
]

[project.scripts]
zmig = "zmig.cli:main"

[project.entry-points."zmig.analyzers"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["zmig"]
artifacts = ["zmig/data/*.json", "zmig/data/*.yaml", "zmig/schema/*.json"]

[tool.ruff]
# Verbatim third-party sources used as test inputs (patches must apply to them as-is).
extend-exclude = ["tests/fixtures/patch-methods"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["zmig"]
# Run as standalone scripts against each Zephyr tree's own (untyped) libraries.
exclude = ["zmig/extract/"]

[[tool.mypy.overrides]]
module = ["west.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "build: runs real Zephyr builds (slow, needs the zephyr mirror and host gcc)",
    "network: needs network access to clone or fetch",
    "sdk: needs the Zephyr SDK (>= 1.0, arm-zephyr-eabi) for cross builds",
]
addopts = "-m 'not build and not network and not sdk'"
