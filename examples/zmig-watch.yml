# zmig watch: example GitHub Actions workflow (DESIGN.md, "CI mode (zmig watch)").
#
# Ran in GitHub Actions on 2026-10-28 in a private test repo (eval/reports/CI-TEST.md has the
# runs); the fixes those runs needed are in this file. Every `uses:` is pinned to the
# commit its tag pointed to on 2026-10-28 (`git ls-remote`). "verified" below means a real
# run with exactly these inputs passed; "UNVERIFIED" means it never ran successfully:
# - the cron schedules (only workflow_dispatch ran; it takes the same path);
# - the SARIF upload (it ran, but code scanning was not enabled on the test repo);
# - the fork-PR conditions (needs a second account).
#
# Copy to .github/workflows/zmig-watch.yml and edit the ZMIG_* values for your app.

name: zmig watch

on:
  # `pull_request`, never `pull_request_target`: the scan builds the PR's code, and
  # `pull_request_target` would run that code with a write token and the base repo's
  # secrets. With `pull_request`, fork PRs get a read-only token and no secrets, so the
  # comment step below can't post for them; the job summary carries the comment instead.
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly: track the next release
    - cron: "0 4 * * 1"   # weekly (Mondays): track main (optional; delete if unwanted)
  workflow_dispatch:

env:
  ZMIG_VERSION: "0.1.0"
  # The zmig package to install, pinned by commit. zmig isn't on PyPI. The baseline
  # records the zmig build, so upgrade zmig in a PR that changes this pin and includes
  # `zmig watch ... --rebase-baseline --reason ...` (DESIGN.md, "CI mode (zmig watch)").
  ZMIG_PIP: "zmig[zephyr,api] @ git+https://github.com/beriberikix/zmig@COMMIT_SHA"
  ZMIG_ARGS: >-
    --shallow
    --app app --board usb2canfdv1
    --module cmsis --module hal_stm32
    --cmake-arg=-DZEPHYR_EXTRA_MODULES=${{ github.workspace }}
    --cmake-arg=-DFILE_SUFFIX=usbd_next
    --sdk ${{ github.workspace }}/../zephyr-sdk-0.16.8
  ZEPHYR_SDK: "0.16.8"

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # SARIF upload (same-repo PRs and scheduled runs only)
      actions: read            # upload-sarif reads the workflow run (CI run 40764423331 failed without it)
      pull-requests: write     # the PR comment (same-repo PRs only)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4; verified

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5; verified
        with:
          python-version: "3.12"

      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build device-tree-compiler dwarves abigail-tools

      # Cache key: zmig version, west.yml hash and run id, never the baseline (a baseline
      # edit doesn't change what's cached). The scheduled run on the default branch saves
      # it (1.65 GB in the test repo); PR runs restore the latest by prefix (verified: 74 s).
      # The per-repository cache size limit and eviction under nightly churn (one new
      # entry per nightly) are UNVERIFIED: check them against GitHub's cache docs.
      # Restore and save are separate steps: actions/cache's post-step only saves when the
      # job succeeds, and a nightly that finds something fails (CI run 40764423331 saved
      # nothing). Scheduled/dispatched runs save under a per-run key; PRs only restore.
      - name: Restore zmig cache (mirror, workspaces, parse cache)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4; verified (a PR restored the default branch's cache)
        with:
          path: |
            ~/.cache/zmig/mirrors
            ~/.cache/zmig/workspaces
            ~/.cache/zmig/api
          key: zmig-${{ env.ZMIG_VERSION }}-${{ hashFiles('west.yml') }}-${{ github.run_id }}
          restore-keys: zmig-${{ env.ZMIG_VERSION }}-${{ hashFiles('west.yml') }}-

      - name: Zephyr SDK ${{ env.ZEPHYR_SDK }} (ARM toolchain only)
        # Release asset names verified (gh release view, and the CI runs).
        run: |
          cd ..
          base=https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v$ZEPHYR_SDK
          curl -sSfL $base/zephyr-sdk-${ZEPHYR_SDK}_linux-x86_64_minimal.tar.xz | tar -xJ
          cd zephyr-sdk-$ZEPHYR_SDK
          curl -sSfL $base/toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz | tar -xJ

      - run: pip install "$ZMIG_PIP"

      - name: zmig watch
        id: zmig
        shell: bash
        run: |
          case "${{ github.event_name }}/${{ github.event.schedule }}" in
            "schedule/0 4 * * 1") to="--to track:main" ;;
            schedule/*|workflow_dispatch/*) to="--to track:next-release" ;;
            *) to="" ;;   # pull_request: pinned to the baseline's target SHA
          esac
          set +e
          zmig watch $ZMIG_ARGS $to --baseline .zmig/baseline.json \
            --sarif zmig.sarif --pr-comment zmig-comment.md --out zmig-out
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 4 = inconclusive. On a PR it's a warning (the job passes; see §6 on "neutral");
          # on a scheduled run it fails the job.
          if [ $code -eq 4 ] && [ "${{ github.event_name }}" = pull_request ]; then
            echo "::warning title=zmig watch::inconclusive: no new finding, but the run couldn't check everything (see the job summary)"
            exit 0
          fi
          exit $code

      - name: Save zmig cache (scheduled and dispatched runs, even when zmig failed)
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4; verified
        with:
          path: |
            ~/.cache/zmig/mirrors
            ~/.cache/zmig/workspaces
            ~/.cache/zmig/api
          key: zmig-${{ env.ZMIG_VERSION }}-${{ hashFiles('west.yml') }}-${{ github.run_id }}

      - name: Upload SARIF
        # Code scanning may be unavailable (private repo without GitHub Code Security: CI
        # run 40765935133). The step then fails, but the job's result stays zmig's.
        continue-on-error: true
        if: always() && hashFiles('zmig.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4 (v3 is deprecated); inputs UNVERIFIED (code scanning was disabled)
        with:
          sarif_file: zmig.sarif
          category: zmig

      - name: PR comment (one comment, edited in place)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('zmig-comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.body | startswith("<!-- zmig-watch -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@zmig-comment.md
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@zmig-comment.md
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4; verified
        with:
          name: zmig-watch
          path: zmig-out
