name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests read git history (fork fixture)
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra zephyr --extra mcuboot --extra api --group dev
      - name: Lint
        run: uv run ruff check zmig tests
      - name: Types
        run: uv run mypy
      - name: Tests (no builds, network or SDK; see pyproject markers)
        run: uv run pytest -q
