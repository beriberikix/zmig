# Starting points for the hazard checks (docs/DESIGN-P1.md §3): the identifiers whose
# definitions decide a format. This is the only Zephyr/MCUboot knowledge zmig brings in.
# Every seed is located in the source at each ref (git grep at the pinned SHA, under
# `paths`); a seed that isn't found makes the checks that use it unknown at that ref.
#
# kinds:
#   define         `#define NAME value` (every definition, including conditional ones)
#   define-prefix  every `#define` whose name starts with NAME
#   struct/union   the member list of `struct NAME { ... }` / `union NAME { ... }`
#   initializer    the initializer text of a variable definition `... NAME = { ... };`

mcuboot:
  paths: [boot/bootutil]
  groups:
    image-format:
      reason: >-
        What a bootloader checks when it reads an image: header layout and magic, TLV
        area magics, TLV type IDs, image flags. Used by direction (a), by the signed-image
        parser, and to read the source image with the target bootloader (direction b).
      seeds:
        - {kind: define, name: IMAGE_MAGIC, reason: header magic the bootloader requires}
        - {kind: define, name: IMAGE_HEADER_SIZE, reason: struct image_header size}
        - {kind: define, name: IMAGE_TLV_INFO_MAGIC, reason: unprotected TLV area magic}
        - {kind: define, name: IMAGE_TLV_PROT_INFO_MAGIC, reason: protected TLV area magic}
        - {kind: define-prefix, name: IMAGE_TLV_, reason: TLV type IDs}
        - {kind: define-prefix, name: IMAGE_F_, reason: image header flags}
        - {kind: struct, name: image_header, reason: header layout}
        - {kind: struct, name: image_version, reason: version field layout}
        - {kind: struct, name: image_tlv_info, reason: TLV area header layout}
        - {kind: struct, name: image_tlv, reason: TLV entry header layout}
    boot-state:
      reason: >-
        What a bootloader reads from the image trailer and swap status to decide whether
        an update or a swap is pending. A change means a newer bootloader can misread
        state an older one wrote (direction b).
      seeds:
        - {kind: union, name: boot_img_magic_t, reason: trailer magic representation}
        - {kind: initializer, name: boot_img_magic, reason: trailer magic bytes}
        - {kind: define-prefix, name: BOOT_MAGIC_, reason: trailer magic size and states}
        - {kind: define, name: BOOT_MAX_ALIGN, reason: trailer field alignment}
        - {kind: define-prefix, name: BOOT_FLAG_, reason: image-ok and copy-done values}
        - {kind: define-prefix, name: BOOT_SWAP_TYPE_, reason: swap type values}
        - {kind: define-prefix, name: BOOT_STATUS_, reason: swap status layout}
        - {kind: struct, name: boot_swap_state, reason: trailer state fields}

imgtool:
  # Module-level literal constants (ast.literal_eval, never executed).
  files: [scripts/imgtool/image.py]
  # The click option whose default is the image byte order.
  endian_option: {file: scripts/imgtool/main.py, option: --endian}

storage:
  # Backend source trees in the Zephyr tree. A symbol is a backend's when its Kconfig
  # definition is under one of `trees`; the backend is enabled when such a symbol is y in
  # the app's resolved .config. Each tree is verified to exist at each ref.
  backends:
    settings:
      trees: [subsys/settings]
      seeds:
        - {kind: define-prefix, name: NVS_, reason: settings-on-NVS record IDs (name/value ids)}
        - {kind: define-prefix, name: ZMS_, reason: settings-on-ZMS record IDs and hashing}
    nvs:
      trees: [subsys/fs/nvs]
      seeds:
        - {kind: struct, name: nvs_ate, reason: on-flash allocation table entry}
        - {kind: define-prefix, name: NVS_, reason: block size, CRC size, status values}
        - {kind: define-prefix, name: ADDR_, reason: address encoding in ATEs}
    zms:
      trees: [subsys/fs/zms]
      seeds:
        - {kind: struct, name: zms_ate, reason: on-flash allocation table entry}
        - {kind: define-prefix, name: ZMS_, reason: version, magic, ATE format, block size}
        - {kind: define-prefix, name: ADDR_, reason: address encoding in ATEs}
    secure_storage:
      trees: [subsys/secure_storage]
      seeds: []
    filesystem:
      trees: [subsys/fs]
      exclude: [subsys/fs/nvs, subsys/fs/zms]
      seeds: []

ble:
  # Persisted Bluetooth state is settings entries. Key names come from the compiled files
  # under `trees` at each ref: settings handler registrations and the host's store calls.
  trees: [subsys/bluetooth]
  handler_macros:
    # name -> how the key path is formed; `prefix_from` names the macro whose definition
    # gives the prefix it prepends (read at each ref, e.g. "bt/" _subtree).
    BT_SETTINGS_DEFINE: {path_arg: 1, prefix_from: BT_SETTINGS_DEFINE}
    SETTINGS_STATIC_HANDLER_DEFINE: {path_arg: 1}
    SETTINGS_STATIC_HANDLER_DEFINE_WITH_CPRIO: {path_arg: 1}
  store_functions:
    # Host helpers whose first argument is a key under the "bt" subtree
    # (bt_settings_encode_key in subsys/bluetooth/host/settings.c); verified to exist.
    bt_settings_store: {prefix: "bt/"}
    bt_settings_delete: {prefix: "bt/"}
  # Leaf names the root "bt" handler compares against (strncmp(name, "x", ...)).
  root_handler_file: subsys/bluetooth/host/settings.c
  seeds:
    - {kind: struct, name: bt_keys, reason: bond keys persisted under bt/keys}
    - {kind: define, name: BT_KEYS_STORAGE_LEN, reason: persisted length of struct bt_keys}
    - {kind: struct, name: bt_ltk, reason: long term key layout}
    - {kind: struct, name: bt_irk, reason: identity resolving key layout}
    - {kind: struct, name: bt_csrk, reason: signing key layout}
  identity_symbols:
    - {name: BT_ID_MAX, reason: number of local identities}
    - {name: BT_PRIVACY, reason: RPA use; changes the identity a peer sees}
    - {name: BT_MAX_PAIRED, reason: bond slots; fewer drops bonds}
    - {name: BT_SETTINGS, reason: whether bonds persist at all}
    - {name: BT_KEYS_OVERWRITE_OLDEST, reason: bond eviction policy}
