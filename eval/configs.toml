# Every scored zmig evaluation configuration (docs/EVALUATION.md), with its inputs pinned to
# public commits and its invocation exactly as scored. eval/run.py reads this file.
#
# Placeholders in app/cmake_args/from/to: {src:NAME} is the checkout of [sources.NAME].
# sdk names a directory under ~/.cache/zmig/sdks (zephyr-sdk-<sdk>).

# --- Sources -------------------------------------------------------------------------------
# kind "git": a project checked out at `sha` (shallow), with `submodules` initialized.
# `dir` overrides the checkout's directory name (default: the repository's).
# kind "zephyr-fork": a Zephyr fork commit, checked out from a scratch repository that borrows
# zmig's Zephyr mirror objects, so the fork's history connects to upstream (DOGFOOD-1).

[sources.golioth]
kind = "git"
url = "https://github.com/golioth/golioth-firmware-sdk"
sha = "1fc16f4afec5e7ed2fa7bcfd9735ba1651bde0e1"
submodules = ["external/libcoap", "external/zcbor"]

[sources.bms-firmware]
kind = "git"
url = "https://github.com/LibreSolar/bms-firmware"
sha = "77c6206b92399028af6a5ca893afecc87236ee7f"

[sources.thingset-zephyr-sdk]
kind = "git"
url = "https://github.com/ThingSet/thingset-zephyr-sdk"
sha = "48740769cea0d9666fc9132cd8923f9ce2c088f9"

[sources.thingset-node-c]
kind = "git"
url = "https://github.com/ThingSet/thingset-node-c"
sha = "68c7544830df2ba23f67e31bad91e124377827a3"

[sources.cannectivity]
kind = "git"
url = "https://github.com/CANnectivity/cannectivity"
sha = "80612eec6d3f3dd1e7ca6ae0096a79e834cdad2b"  # tag v1.1.0

[sources.zmk]
kind = "git"
url = "https://github.com/zmkfirmware/zmk"
sha = "b8846cf6355c5d7ae52a191988054b532a264f0c"  # parent of the v3.5 bump series

[sources.zmk-zephyr-from]
kind = "zephyr-fork"
dir = "zephyr-from"  # the scored run's directory name (it is in finding IDs)
url = "https://github.com/zmkfirmware/zephyr"
sha = "1ae0eb5ce8adafcec993e6fb8f4eeb6f818a7772"  # v3.2.0 + 34 fork commits

[sources.zmk-zephyr-to]
kind = "zephyr-fork"
dir = "zephyr-to"  # the scored run's directory name (it is in finding IDs)
url = "https://github.com/zmkfirmware/zephyr"
sha = "339570e2393b108bf8f9241018ecaf5615c25469"  # v3.5.0 + 21 fork commits

# --- Configurations ------------------------------------------------------------------------
# One per EVALUATION.md row. `oracle` is where its items are; `scored` says which run the
# baseline in eval/baselines/<name>.json was taken from.

[configs.golioth-B]
oracle = "docs/oracles/golioth.md"
scored = "DOGFOOD-9 to 11 (zmig 983fe98; findings unchanged since DOGFOOD-10)"
app = "{src:golioth}/examples/zephyr/hello"
board = "nucleo_h563zi/stm32h563xx"
from = "v4.1.0"
to = "v4.2.0"
sdk = "0.16.8"
modules = ["hal_stm32", "cmsis", "cmsis_6", "mbedtls", "zcbor"]
cmake_args = ["-DZEPHYR_EXTRA_MODULES={src:golioth}"]

